<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-operator · 真实客户端卡片预览</title>
<style>
  :root{
    --bg:#f5f3ee; --panel:#fffdf9; --ink:#26231e; --muted:#746e64; --line:#e7e1d6;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{ --bg:#14161a; --panel:#1b1e24; --ink:#e9e6df; --muted:#9aa0ab; --line:#2a2f38; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  .shell{max-width:820px;margin:0 auto;padding:22px 18px 80px}
  h1{font-size:15px;letter-spacing:.2px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  .hint kbd{font:11.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px}
  .stage{display:flex;flex-direction:column;gap:14px}
  .case{display:flex;flex-direction:column;gap:6px}
  .case .cap{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
  .toolbar{display:flex;gap:8px;margin-bottom:14px}
  .toolbar button{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:8px;cursor:pointer;
    background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  #err{color:#c0392b;font:12.5px var(--mono);white-space:pre-wrap}
</style>
</head>
<body>
<div class="shell">
  <h1>dsh-operator 真实客户端卡片预览</h1>
  <p class="hint">本页直接加载 <code>client/client.js</code>（不经构建），用一个极小的 React 兼容层渲染真实卡片；<kbd>⌘⇧R</kbd> 可重跑；右上按钮切换明暗与状态。</p>
  <div class="toolbar">
    <button id="theme">切换主题</button>
    <button id="rerun">重跑渲染</button>
  </div>
  <div id="err"></div>
  <div class="stage" id="stage"></div>
</div>
<script>
// ---- 迷你 React 兼容层：createElement + 同步渲染到 DOM（仅覆盖卡片用到的 API） ----
window.__ModuleLoader__ = { load(def) { window.__dopDef = def; } };

function flatten(chars) { return chars.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false && c !== true && c !== ""); }
const MiniReact = {
  createElement(type, props, ...children) { return { type, props: props || {}, children: flatten(children) }; },
  Fragment: "fragment",
  useRef(init) { const r = { current: init }; return r; }
};

function renderNode(node, host) {
  if (node === null || node === undefined || node === false) return null;
  if (typeof node === "string" || typeof node === "number") return document.createTextNode(String(node));
  if (Array.isArray(node)) {
    const frag = document.createDocumentFragment();
    for (const child of node) { const el = renderNode(child, frag); if (el) frag.appendChild(el); }
    return frag;
  }
  const { type, props = {}, children = [] } = node;
  if (typeof type === "function") {
    const child = children.length === 0 ? undefined : children.length === 1 ? children[0] : children;
    return renderNode(type(Object.assign({}, props, { children: child })), host);
  }
  const el = document.createElement(type === "fragment" ? "div" : type);
  for (const [key, value] of Object.entries(props)) {
    if (key === "key" || key === "children") continue;
    if (key === "ref") {
      if (typeof value === "function") queueMicrotask(() => value(el));
      else if (value && typeof value === "object") value.current = el;
      continue;
    }
    if (key === "style" && value && typeof value === "object") {
      for (const [name, v] of Object.entries(value)) {
        if (name.startsWith("--")) el.style.setProperty(name, v);
        else el.style[name] = v;
      }
      continue;
    }
    if (key.startsWith("on") && typeof value === "function") {
      el.addEventListener(key.slice(2).toLowerCase(), value);
      continue;
    }
    if (key === "className") { el.setAttribute("class", value === null ? "" : String(value)); continue; }
    if (value === null || value === undefined || value === false) continue;
    el.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children) { const el2 = renderNode(child, el); if (el2) el.appendChild(el2); }
  return el;
}
</script>
<script src="../client/client.js"></script>
<script>
const fakeImage = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260"><rect width="400" height="260" fill="#2b3242"/>' +
  '<rect x="26" y="26" width="348" height="26" rx="6" fill="#3f4a60"/><rect x="26" y="70" width="210" height="12" rx="6" fill="#55627c"/>' +
  '<rect x="26" y="96" width="300" height="90" rx="8" fill="#39425a"/><circle cx="330" cy="210" r="22" fill="#5b7cfa"/></svg>');

function loadImage(attachment) {
  const url = fakeImage;
  return Object.assign(Promise.resolve(url), { peek: () => url });
}

function argsRawOf(args) { return JSON.stringify(args); }
const now = Date.now();

const CASES = [
  {
    cap: "running · ax_batch 第 2/3 步（确认门 + 后台徽标 + 实时耗时）",
    props: {
      phase: "start", callId: "c1", toolName: "ax_batch", loadImage,
      block: {
        phase: "start", callId: "c1", name: "ax_batch", turn: 3, step: 7, time: now - 2600, subCalls: [],
        argsRaw: argsRawOf({ steps: [{ action: "press", role: "AXButton", name: "确定" }, { action: "set_value", title: "搜索框" }, { action: "press", title: "提交" }] }),
        args: { steps: [{ action: "press", role: "AXButton", name: "确定" }, { action: "set_value", title: "搜索框" }, { action: "press", title: "提交" }] }
      }
    }
  },
  {
    cap: "running · ax_press 前台操作（确认门 + 前台徽标）",
    props: {
      phase: "start", callId: "c0", toolName: "ax_press", loadImage,
      block: {
        phase: "start", callId: "c0", name: "ax_press", turn: 2, step: 4, time: now - 900, subCalls: [],
        argsRaw: argsRawOf({ role: "AXButton", title: "保存", delivery_mode: "foreground" }),
        args: { role: "AXButton", title: "保存", delivery_mode: "foreground" }
      }
    }
  },
  {
    cap: "ok · cu_observe 带截图（缩略图 + 完成折叠摘要）",
    props: {
      phase: "result", callId: "c2", toolName: "cu_observe", loadImage,
      block: {
        kind: "tool-result", seq: 42, time: now, callId: "c2", name: "cu_observe", callTime: now - 3100,
        args: { action: "screenshot" }, call: { name: "cu_observe", argsRaw: argsRawOf({ action: "screenshot" }) },
        content: [
          { type: "text", text: "Safari › 天气 · 主窗口\n页面显示 26°C，晴，右下角有刷新按钮。" },
          { type: "image", attachment: { attachmentId: "att-1", mediaType: "image/png", bytes: 2048, width: 800, height: 520, name: "shot.png" } }
        ],
        isError: false, subCalls: []
      }
    }
  },
  {
    cap: "error · browser_dom_click 权限被拒（失败原因 + 建议）",
    props: {
      phase: "result", callId: "c3", toolName: "browser_dom_click", loadImage,
      block: {
        kind: "tool-result", seq: 43, time: now, callId: "c3", name: "browser_dom_click", callTime: now - 1200,
        args: { selector: "#submit" }, call: { name: "browser_dom_click", argsRaw: argsRawOf({ selector: "#submit" }) },
        content: [{ type: "text", text: "Error: permission denied — AppleScript JavaScript channel is disabled (not allowed)." }],
        isError: true, error: { name: "Error", message: "permission denied" }, subCalls: []
      }
    }
  },
  {
    cap: "error · ax_batch 第 2 步失败（步骤进度条 + 失败行）",
    props: {
      phase: "result", callId: "c4", toolName: "ax_batch", loadImage,
      block: {
        kind: "tool-result", seq: 44, time: now - 400, callTime: now - 4200, callId: "c4", name: "ax_batch",
        args: { steps: [{ action: "press", title: "打开" }, { action: "press", title: "导出" }] },
        call: { name: "ax_batch", argsRaw: argsRawOf({ steps: [{ action: "press", title: "打开" }, { action: "press", title: "导出" }] }) },
        content: [{ type: "text", text: "1. open ok\n2. press FAILED — element not found (stale token)\n\nfailed at step 2" }],
        isError: true, error: { name: "Error", message: "failed at step 2" }, subCalls: []
      }
    }
  },
  {
    cap: "ok · operator_status（富摘要：channels · AppleScript / links / skill(s)）",
    props: {
      phase: "result", callId: "c5", toolName: "operator_status",
      block: {
        kind: "tool-result", seq: 45, time: now, callTime: now - 80, callId: "c5", name: "operator_status",
        args: {}, call: { name: "operator_status", argsRaw: "" },
        content: [{ type: "text", text: "dsh-operator 0.23.0 (darwin)\ntools: channels · AppleScript (browser) / CGEvent; failure samples on; browserCdpPort 0\nskills 0 · plans 0 · failures files 1" }],
        isError: false, subCalls: []
      }
    }
  },
  {
    cap: "interrupted · 中断卡片",
    props: {
      phase: "result", callId: "c6", toolName: "screenshot_window",
      block: {
        kind: "tool-result", seq: 46, time: now, callTime: now, callId: "c6", name: "screenshot_window",
        args: { window_id: 14397 }, call: { name: "screenshot_window", argsRaw: argsRawOf({ window_id: 14397 }) },
        content: [], isError: true, error: { name: "InterruptedError", code: "interrupted", message: "调用被中断" }, subCalls: []
      }
    }
  }
];

function run() {
  const stage = document.getElementById("stage");
  const errBox = document.getElementById("err");
  stage.textContent = "";
  errBox.textContent = "";
  try {
    if (!window.__dopDef || typeof window.__dopDef.factory !== "function") throw new Error("client.js 未注册 factory");
    const mod = window.__dopDef.factory((name) => { if (name === "react") return MiniReact; throw new Error("unexpected require: " + name); });
    // 通过 apply 捕获注册的视图组件
    let captured = null;
    mod.apply({
      slots: {
        inject(name, fn) { if (name === "tool.call.toolview") fn(); },
        register(_opts, Component) { captured = Component; return () => {}; }
      }
    });
    if (typeof captured !== "function") throw new Error("未捕获到注册的 toolview 组件");
    for (const item of CASES) {
      const box = document.createElement("div");
      box.className = "case";
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = item.cap;
      box.appendChild(cap);
      const host = document.createElement("div");
      host.appendChild(renderNode(MiniReact.createElement(captured, item.props), host));
      box.appendChild(host);
      stage.appendChild(box);
    }
  } catch (error) {
    errBox.textContent = String(error && error.stack ? error.stack : error);
  }
}

document.getElementById("rerun").addEventListener("click", run);
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "" : "dark";
});
run();
</script>
</body>
</html>
