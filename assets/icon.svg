<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dsh-operator">
  <defs>
    <linearGradient id="stroke" x1="110" y1="120" x2="430" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9EFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E131C"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke="url(#stroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- 窗口 -->
    <rect x="128" y="140" width="232" height="180" rx="24"/>
    <path d="M128 190 H360"/>

    <!-- 光标：尖点指向窗口右下角（Computer Use 的通用符号） -->
    <path d="M332 318 L332 442 L364 410 L382 452 L402 443 L384 401 L430 396 Z"/>
  </g>
</svg>
